<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Biswajeet Behera — Data Science Portfolio</title>
  <desc id="desc">A professional profile banner presenting research, data, insights, decisions, impact, analytics, and machine learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081526"/>
      <stop offset="0.58" stop-color="#0d2846"/>
      <stop offset="1" stop-color="#075e6b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#39d0d8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="12" height="320" rx="6" fill="url(#accent)"/>

  <g transform="translate(760 34)">
    <circle cx="184" cy="126" r="112" fill="#ffffff" fill-opacity="0.07"/>
    <circle cx="184" cy="126" r="78" fill="#39d0d8" fill-opacity="0.10"/>
    <circle cx="184" cy="126" r="44" fill="#58a6ff" fill-opacity="0.12"/>
    <path d="M36 226 C98 162 135 186 184 126 C235 64 278 98 350 34" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="36" cy="226" r="9" fill="#58a6ff"/>
    <circle cx="184" cy="126" r="9" fill="#39d0d8"/>
    <circle cx="350" cy="34" r="9" fill="#ffffff"/>
    <g fill="#0d2846" stroke="#8bc8ff" stroke-width="3">
      <rect x="55" y="160" width="20" height="66" rx="5"/>
      <rect x="88" y="137" width="20" height="89" rx="5"/>
      <rect x="121" y="108" width="20" height="118" rx="5"/>
    </g>
  </g>

  <text x="72" y="70" fill="#70e1e6" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2.4">RESEARCH • DATA • INSIGHTS • DECISIONS • IMPACT</text>
  <text x="72" y="139" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="55" font-weight="700">Biswajeet Behera</text>
  <text x="72" y="184" fill="#cce7ff" font-family="Segoe UI, Arial, sans-serif" font-size="20">Extracting, Loading, and Transforming Data into Actionable Decisions</text>

  <g transform="translate(72 218)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
    <rect width="184" height="42" rx="21" fill="#123d66" stroke="#58a6ff" stroke-opacity="0.55"/>
    <text x="92" y="27" text-anchor="middle" fill="#a9d5ff">Research-Oriented</text>
    <rect x="196" width="190" height="42" rx="21" fill="#10414a" stroke="#39d0d8" stroke-opacity="0.55"/>
    <text x="291" y="27" text-anchor="middle" fill="#8de9ed">Analytics Portfolio</text>
    <rect x="398" width="192" height="42" rx="21" fill="#29264d" stroke="#bc8cff" stroke-opacity="0.55"/>
    <text x="494" y="27" text-anchor="middle" fill="#d7bdff">Machine Learning</text>
  </g>

  <rect x="72" y="287" width="620" height="4" rx="2" fill="url(#accent)"/>
</svg>
